name: CI and Windows package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q desktop_app.py core tests
      - name: Test
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  windows-package:
    name: Windows portable EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build and frozen smoke test
        shell: powershell
        run: ./build_windows.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Log-Data-Analyst-Windows-v${{ github.run_number }}
          path: WoW-Log-Data-Analyst-v*-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 14
