name: bootstrap-v018-source

on:
  push:
    branches: [chatgpt/1-v018-review-hardening]
    paths:
      - '.bootstrap/READY'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full v0.18 source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-*.b64 | base64 -d > /tmp/v018-source.tar.xz
          echo '3e328a523b5df8f5f8881b27d82072c543dd3b393872f77406218f9bcd451380  /tmp/v018-source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v018-source.tar.xz -C .
          # This workflow token lacks permission to modify workflow files.
          # Keep the bootstrap workflow untouched here; ChatGPT installs the
          # real CI workflow through the GitHub connector after this import.
          git checkout HEAD -- .github/workflows/bootstrap-source.yml
          rm -f .github/workflows/ci.yml .github/workflows/build-desktop.yml
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import full v0.18.0 source [skip bootstrap]'
          git push origin HEAD:${GITHUB_REF_NAME}
