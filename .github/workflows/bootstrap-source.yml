name: bootstrap-v018-source

on:
  push:
    branches: [chatgpt/1-v018-review-hardening]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full v0.18 source tree
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .bootstrap/chunk-01.b64 > /tmp/v018-code.tar.xz
          tar -xJf /tmp/v018-code.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import full v0.18.0 source [skip bootstrap]'
          git push origin HEAD:${GITHUB_REF_NAME}
